name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ecommerce
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v5

      # ตรงกับ Python ใน Airflow image (apache/airflow:3.3.2-python3.12) ที่รัน pipeline จริง
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit + integration tests
        # ใน CI ห้าม skip เทสต์ที่ใช้ DB (ดู tests/conftest.py)
        run: pytest -q

      - name: Load 3 days of real data
        run: |
          python -m ingest.run init
          python -m ingest.split_batches
          for day in 2010-12-01 2010-12-02 2010-12-03; do
            python -m ingest.run load --date "$day"
          done

      - name: dbt build
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: dbt build again for one day (must stay idempotent)
        run: |
          dbt build --project-dir dbt_project --profiles-dir dbt_project --vars '{"run_date": "2010-12-02"}'
          python - <<'PY'
          from ingest.db import get_engine
          from sqlalchemy import text
          with get_engine().connect() as conn:
              fact, stg = conn.execute(text("""
                  SELECT (SELECT count(*) FROM marts.fact_sales),
                         (SELECT count(*) FROM staging.stg_online_retail WHERE customer_id IS NOT NULL)
              """)).one()
          print(f"fact_sales={fact} staging_with_customer={stg}")
          assert fact == stg and fact > 0
          PY
