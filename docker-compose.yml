services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    env_file: .env          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: ecommerce-airflow:3.3.2
    container_name: ecommerce_airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # pipeline ใน container ต่อ Postgres ผ่าน network ของ compose
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # ใช้ในเครื่องเท่านั้น: ไม่ต้อง login
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    command: bash -c "python /opt/project/airflow/init_metadata_db.py && exec airflow standalone"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
      - airflow_home:/opt/airflow/logs

  # สร้าง database 'metabase' (เก็บ dashboard / ผู้ใช้ของ Metabase) ถ้ายังไม่มี แล้วจบ
  metabase-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      sh -c "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT 1 FROM pg_database WHERE datname = 'metabase'\" | grep -q 1
      || psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE metabase'"

  metabase:
    image: metabase/metabase:v0.64.1
    container_name: ecommerce_metabase
    depends_on:
      metabase-db-init:
        condition: service_completed_successfully
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_OPTS: -Xmx1g
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  airflow_home:
