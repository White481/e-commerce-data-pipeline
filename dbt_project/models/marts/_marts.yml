version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: stock_code
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: weekday
        data_tests:
          - accepted_values:
              arguments:
                values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

  - name: fact_sales
    description: One row per invoice line with a known customer
    columns:
      - name: line_id
        data_tests: [unique, not_null]
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: is_return
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
