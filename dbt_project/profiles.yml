# อ่านค่าเชื่อมต่อจาก env (ชุดเดียวกับ .env) ไม่มี credential ในไฟล์นี้
# รันในเครื่อง: make dbt-build (โหลด .env ให้) | ใน Airflow: env มาจาก docker-compose
ecommerce:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4
